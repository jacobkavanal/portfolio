<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta | Jacob Kavanal</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="meta.js"></script>
</head>
<body>
  <h1>Meta</h1>
  <p>This page reports a meta-analysis of the code in this portfolio.</p>

  <h2>Summary</h2>
  <div id="stats"></div>

  <label id="slider-label" for="commit-progress">
    Show commits before: <time id="commit-time"></time>
    <input type="range" id="commit-progress" min="0" max="100" value="100">
  </label>

  <h2>Commits by time of day</h2>

  <div id="scrolly-1">
    <div id="scatter-plot">
      <div id="chart"></div>
    </div>
    <div id="scatter-story"></div>
  </div>

  <h2>Files</h2>
  <dl id="files"></dl>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a href="" id="commit-link" target="_blank"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-tooltip-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
